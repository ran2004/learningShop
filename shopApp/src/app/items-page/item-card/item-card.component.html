<mat-card class="itemCard">
    <div class="itemInfo">
      <div class="mat-body-1">{{ item.name }}</div>
      <div class="mat-body-1">Price: ${{ item.price }}</div>
    </div>
  <mat-card-content>
    <p class="preventOverflowText">Amount Available: {{ item.amount }}</p>
    <div class="itemActions">
      <button *ngIf="item.amount" (click)="Buy()">Buy</button>
      <button *ngIf="isAdmin" (click)="Add()">Add</button>
    </div>
  </mat-card-content>
</mat-card>
