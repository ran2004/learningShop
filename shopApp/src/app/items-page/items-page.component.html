<div class="item-page">
  <h1>Shop</h1>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Search items..."
    class="filter-input"
  />
  <div class="item-list">
    <app-item-card
      class="itemCard"
      *ngFor="let item of filteredItems"
      [isAdmin]="isAdmin"
      [item]="item"
      [buyItem]="buyItem.bind(this)"
      [addToItem]="addToItem.bind(this)"
    ></app-item-card>
  </div>
</div>
